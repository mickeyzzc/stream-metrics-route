name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Get version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      - name: Build binaries
        run: |
          mkdir -p artifacts

          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o artifacts/stream-metrics-route-linux-amd64 ./cmd/stream-metrics-route/

          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-w -s" -o artifacts/stream-metrics-route-linux-arm64 ./cmd/stream-metrics-route/

          # Create tar.gz archives
          cd artifacts
          tar -zcvf stream-metrics-route-${{ env.VERSION }}-linux-amd64.tar.gz stream-metrics-route-linux-amd64
          tar -zcvf stream-metrics-route-${{ env.VERSION }}-linux-arm64.tar.gz stream-metrics-route-linux-arm64
          sha256sum stream-metrics-route-${{ env.VERSION }}-*.tar.gz > checksums.txt

      - name: Extract release notes from CHANGELOG.md
        id: extract_changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract content between the first and second "## [" headings
            awk '
              /^## \[/ { count++; next }
              count == 1 { print }
              count >= 2 { exit }
            ' CHANGELOG.md > release_notes.tmp

            if [ -s release_notes.tmp ]; then
              {
                echo "body<<EOF"
                cat release_notes.tmp
                echo "EOF"
              } >> $GITHUB_OUTPUT
            else
              echo "body=See CHANGELOG.md for details." >> $GITHUB_OUTPUT
            fi
          else
            echo "body=See CHANGELOG.md for details." >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ env.VERSION }}
          body: ${{ steps.extract_changelog.outputs.body }}
          files: |
            artifacts/stream-metrics-route-${{ env.VERSION }}-linux-amd64.tar.gz
            artifacts/stream-metrics-route-${{ env.VERSION }}-linux-arm64.tar.gz
            artifacts/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
